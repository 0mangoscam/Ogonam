<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ogonam</title>
<style>
:root{--lime:#b6ff35;--cyan:#5ce8ff;--pink:#ff4fd8;--red:#e83b2f;--blue:#1357b7;--cream:#f5eee0;--line:#ffffff22}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050a;color:#fff;font-family:Arial Black,Impact,system-ui,sans-serif}
body{display:flex;flex-direction:column}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff07 50%,#00000012 50%);background-size:100% 4px;mix-blend-mode:overlay;opacity:.35;z-index:20}
header{flex:0 0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:#07070bcc;z-index:10}
h1{margin:0;font-size:clamp(38px,13vw,64px);line-height:.82;letter-spacing:-2px;text-transform:uppercase;text-shadow:4px 4px 0 #000,-2px 0 var(--pink)}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden}
#stageWrap{flex:1 1 auto;min-height:0;position:relative;border-radius:18px;border:2px solid #ffffff18;background:radial-gradient(circle at 50% 20%,#242845 0,#11111a 52%,#07070b 100%);overflow:hidden;box-shadow:inset 0 0 55px #000}
#viewport{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#nameplate{position:absolute;left:16px;top:16px;background:#000b;border:3px solid var(--lime);padding:10px 14px;box-shadow:5px 5px #000;z-index:5;text-transform:uppercase;font-size:clamp(15px,4vw,22px);pointer-events:none}
#toolDock{flex:0 0 220px;width:100%;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#toolDock::-webkit-scrollbar{height:0}.panel{flex:0 0 86vw;max-width:430px;min-width:292px;height:200px;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;background:linear-gradient(180deg,#1d1d2c,#11111a);border:2px solid #ffffff20;box-shadow:6px 6px 0 #00000080;border-radius:18px;padding:14px}
h2{margin:0 0 10px;color:var(--cyan);text-transform:uppercase;font-size:18px;text-shadow:2px 2px #000}label{display:block;margin:8px 0 4px;font-size:12px;text-transform:uppercase;color:#ffffffb8}input,select{width:100%;min-height:42px;border-radius:8px;border:2px solid #ffffff25;padding:8px;font-size:16px;color:#111;background:white}input[type=range]{accent-color:var(--lime)}button{width:100%;min-height:54px;border:0;border-radius:14px;margin:6px 0;padding:10px 12px;font-family:Arial Black,Impact,system-ui,sans-serif;font-size:13px;text-transform:uppercase;color:#111;background:linear-gradient(180deg,var(--lime),#70b71a);box-shadow:4px 4px 0 #000}button.pink{background:linear-gradient(180deg,var(--pink),#a22088);color:white}button.blue{background:linear-gradient(180deg,var(--cyan),#208fc7)}button.danger{background:linear-gradient(180deg,#ff3535,#8d0000);color:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small,#status{font:12px system-ui,sans-serif;color:#ffffffa8;line-height:1.35}#status{color:#d8f9ff}
@media (orientation:landscape){header{padding:max(8px,env(safe-area-inset-top)) 12px 6px}h1{font-size:clamp(28px,7vw,46px)}main{flex-direction:row;gap:10px}#stageWrap{flex:1 1 auto;height:100%}#toolDock{flex:0 0 340px;height:100%;flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;padding:4px 8px 8px}.panel{flex:0 0 auto;width:100%;max-width:none;min-width:0;height:auto;min-height:176px}}
</style>
</head>
<body>
<header><h1>OGONAM</h1></header>
<main>
<section id="stageWrap"><div id="viewport"></div><div id="nameplate">BARRIO GHOST</div></section>
<nav id="toolDock">
<section class="panel"><h2>Herramientas</h2><label>Nombre</label><input id="charName" value="BARRIO GHOST" maxlength="22"/><label>Búsqueda de texturas</label><input id="query" value="canvas clay abstract red blue"/><div class="grid2"><button id="randomizeBtn" class="pink">Randomizar</button><button id="explodeBtn" class="danger">No pulses este botón</button></div></section>
<section class="panel"><h2>Guardar</h2><button id="recordVideoBtn" class="blue">Guardar video</button><button id="recordGifBtn">Guardar GIF</button><p class="small">El vídeo se guarda como WebM. El GIF tarda más porque cocina frames.</p></section>
<section class="panel"><h2>Forma</h2><label>Abstracción</label><input id="abstractness" type="range" min="0" max="100" value="78"/><label>Caos</label><input id="poseChaos" type="range" min="0" max="100" value="70"/><label>Grosor</label><input id="chunkiness" type="range" min="0" max="100" value="68"/></section>
<section class="panel"><h2>Color</h2><label>Estética</label><select id="vibe"><option value="og">Ogonam</option><option value="red">Lienzo rojo</option><option value="blue">Lienzo azul</option><option value="pink">Lienzo rosa</option><option value="green">Lienzo verde</option><option value="mono">B/N</option></select><p id="status">Iniciando Ogonam...</p></section>
</nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);const state={scene:null,camera:null,renderer:null,controls:null,root:null,floor:null,textures:[],procedural:[],materials:[],recording:false};window.state=state;
const palettes={og:['#e83b2f','#1357b7','#f6df55','#2c8b4b','#f5eee0','#191919','#f2a7b7'],red:['#e83b2f','#f5eee0','#1357b7','#2c8b4b','#f6df55','#111111'],blue:['#1357b7','#f5eee0','#e83b2f','#2c8b4b','#f6df55','#111111'],pink:['#f2a7b7','#f5eee0','#e83b2f','#1357b7','#2c8b4b','#111111'],green:['#8dbb32','#f5eee0','#e83b2f','#1357b7','#f6df55','#111111'],mono:['#f5eee0','#d8d0c8','#888888','#242424','#111111']};
const bgColors={og:0x11111a,red:0x7b1511,blue:0x123f85,pink:0x9a5369,green:0x668f24,mono:0x151515};const textureLoader=new THREE.TextureLoader();textureLoader.setCrossOrigin('anonymous');
function setStatus(t){$('status').textContent=t}function rnd(a,b){return a+Math.random()*(b-a)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function updateName(){$('nameplate').textContent=($('charName').value||'NO NAME').toUpperCase()}
function prepTexture(tx){tx.colorSpace=THREE.SRGBColorSpace;tx.wrapS=THREE.RepeatWrapping;tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rnd(.8,2.6),rnd(.8,2.6));tx.needsUpdate=true;return tx}
function makeCanvasTexture(kind,c1,c2){const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d');ctx.fillStyle=c1;ctx.fillRect(0,0,256,256);if(kind==='canvas'){for(let y=0;y<256;y+=4){ctx.fillStyle=y%8===0?c2:c1;ctx.globalAlpha=.16;ctx.fillRect(0,y,256,2)}for(let x=0;x<256;x+=5){ctx.fillStyle=c2;ctx.globalAlpha=.10;ctx.fillRect(x,0,1,256)}ctx.globalAlpha=1}if(kind==='checker'){for(let y=0;y<8;y++)for(let x=0;x<8;x++){ctx.fillStyle=(x+y)%2?c1:c2;ctx.fillRect(x*32,y*32,32,32)}}if(kind==='noise'){for(let i=0;i<2200;i++){ctx.fillStyle=Math.random()>.5?c1:c2;ctx.globalAlpha=Math.random()*.45;ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*18,Math.random()*18)}ctx.globalAlpha=1}if(kind==='stripe'){for(let i=0;i<22;i++){ctx.fillStyle=i%2?c1:c2;ctx.fillRect(i*13,0,7,256)}}return prepTexture(new THREE.CanvasTexture(canvas))}
function rebuildProcedural(){const pal=palettes[$('vibe').value]||palettes.og;state.procedural=[makeCanvasTexture('canvas',rand(pal),rand(pal)),makeCanvasTexture('checker',rand(pal),rand(pal)),makeCanvasTexture('noise',rand(pal),rand(pal)),makeCanvasTexture('stripe',rand(pal),rand(pal)),makeCanvasTexture('canvas','#f5eee0',rand(pal)),makeCanvasTexture('noise','#111111',rand(pal))]}
function texturePool(){return state.textures.length?shuffle([...state.textures,...state.procedural]):shuffle(state.procedural)}function makeMat(){const mat=new THREE.MeshStandardMaterial({color:0xffffff,map:rand(texturePool())||null,roughness:.72,metalness:.08});state.materials.push(mat);return mat}
function clearRoot(){if(!state.root)return;while(state.root.children.length){const child=state.root.children.pop();child.traverse(obj=>{if(obj.geometry)obj.geometry.dispose();if(obj.material){if(Array.isArray(obj.material))obj.material.forEach(m=>m.dispose&&m.dispose());else obj.material.dispose&&obj.material.dispose()}})}state.materials.forEach(m=>m.dispose&&m.dispose());state.materials=[]}
function createScene(){const viewport=$('viewport');state.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});state.renderer.setPixelRatio(Math.min(devicePixelRatio,2));state.renderer.setSize(viewport.clientWidth,viewport.clientHeight);state.renderer.outputColorSpace=THREE.SRGBColorSpace;viewport.appendChild(state.renderer.domElement);state.scene=new THREE.Scene();state.scene.background=new THREE.Color(bgColors[$('vibe').value]||bgColors.og);state.scene.fog=new THREE.Fog(0x07070b,10,30);state.camera=new THREE.PerspectiveCamera(42,viewport.clientWidth/viewport.clientHeight,.1,100);state.camera.position.set(0,2.4,7.4);state.controls=new OrbitControls(state.camera,state.renderer.domElement);state.controls.enableDamping=true;state.controls.dampingFactor=.08;state.controls.target.set(0,2,0);state.controls.minDistance=4;state.controls.maxDistance=12;state.scene.add(new THREE.HemisphereLight(0xffffff,0x111122,1.2));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,8,6);state.scene.add(key);const rim=new THREE.PointLight(0xff4fd8,16,20,2);rim.position.set(-4,4,-4);state.scene.add(rim);const fill=new THREE.PointLight(0x5ce8ff,10,18,2);fill.position.set(4,2,5);state.scene.add(fill);state.floor=new THREE.Mesh(new THREE.CircleGeometry(5.5,64),new THREE.MeshStandardMaterial({color:0x11111a,roughness:.9,metalness:.1}));state.floor.rotation.x=-Math.PI/2;state.scene.add(state.floor);const grid=new THREE.GridHelper(11,14,0x5ce8ff,0x2e2e44);grid.material.transparent=true;grid.material.opacity=.18;state.scene.add(grid);state.root=new THREE.Group();state.scene.add(state.root);window.addEventListener('resize',resize)}
function resize(){const v=$('viewport');if(!state.renderer||!state.camera)return;state.renderer.setSize(v.clientWidth,v.clientHeight);state.camera.aspect=v.clientWidth/v.clientHeight;state.camera.updateProjectionMatrix();fitCameraToObject()}
function tubeGeometry(scale=1,wild=.8,thick=.7){const pts=[];let x=0,y=0,z=0;pts.push(new THREE.Vector3(x,y,z));const count=Math.floor(rnd(3,8+wild*5));for(let i=0;i<count;i++){x+=rnd(-.55,.55)*scale*(1+wild);y+=rnd(-.45,.45)*scale*(1+wild);z+=rnd(-.34,.34)*scale*(1+wild);pts.push(new THREE.Vector3(x,y,z))}const curve=new THREE.CatmullRomCurve3(pts);const geo=new THREE.TubeGeometry(curve,52,scale*rnd(.055,.16)*(.75+thick),12,false);geo.center();return geo}
function ringGeometry(scale=1,wild=.8,thick=.7){const geo=new THREE.TorusGeometry(scale*rnd(.35,.9),scale*rnd(.045,.14)*(.9+thick),12,72,rnd(Math.PI*1.1,Math.PI*2));geo.center();return geo}function capsuleGeometry(scale=1,wild=.8,thick=.7){const geo=new THREE.CapsuleGeometry(scale*rnd(.09,.22)*(.85+thick),scale*rnd(.45,1.65)*(.8+wild),8,14);geo.center();return geo}function blobGeometry(scale=1){const geo=new THREE.SphereGeometry(scale*rnd(.28,.72),18,14);geo.scale(rnd(.7,1.5),rnd(.6,1.4),rnd(.6,1.4));geo.center();return geo}
function add(geo,pos,rot,scl=1){const mesh=new THREE.Mesh(geo,makeMat());mesh.position.set(pos[0],pos[1],pos[2]);mesh.rotation.set(rot[0],rot[1],rot[2]);mesh.scale.setScalar(scl);mesh.userData.spin=rnd(-.01,.01);state.root.add(mesh);return mesh}
function buildCharacter(){updateName();rebuildProcedural();clearRoot();const wild=Number($('abstractness').value)/100,chaos=Number($('poseChaos').value)/100,thick=Number($('chunkiness').value)/100;state.scene.background=new THREE.Color(bgColors[$('vibe').value]||bgColors.og);state.root.position.set(0,1.85,0);state.root.rotation.set(0,0,0);add(blobGeometry(1.1),[0,0,0],[rnd(0,Math.PI),rnd(0,Math.PI),rnd(0,Math.PI)],1.1);add(ringGeometry(1.35,wild,thick),[0,.15,0],[rnd(0,Math.PI),rnd(0,Math.PI),rnd(0,Math.PI)],1);add(tubeGeometry(1.25,wild,thick),[0,.1,0],[rnd(0,Math.PI),rnd(0,Math.PI),rnd(0,Math.PI)],1);const count=Math.floor(13+wild*20);for(let i=0;i<count;i++){const pick=Math.random();const geo=pick<.48?tubeGeometry(rnd(.45,1.05),wild,thick):pick<.72?ringGeometry(rnd(.35,.9),wild,thick):pick<.9?capsuleGeometry(rnd(.45,1.05),wild,thick):blobGeometry(rnd(.35,.9));add(geo,[rnd(-1.8,1.8)*chaos,rnd(-1.4,1.5)*chaos,rnd(-1.3,1.3)*chaos],[rnd(0,Math.PI),rnd(0,Math.PI),rnd(0,Math.PI)],rnd(.75,1.25))}fitCameraToObject();setStatus(state.textures.length?'Texturas públicas aplicadas.':'Texturas internas aplicadas. Pulsa Enter en búsqueda para cargar públicas.')}
function fitCameraToObject(){if(!state.root||!state.camera||!state.controls)return;const box=new THREE.Box3().setFromObject(state.root);const size=box.getSize(new THREE.Vector3()).length();const center=box.getCenter(new THREE.Vector3());state.controls.target.copy(center);state.camera.position.set(center.x,center.y+1.2,center.z+Math.max(5.4,size*.72));state.camera.lookAt(center);state.controls.update()}
async function fetchWikimedia(q){const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q+' texture public domain canvas art clay')}&gsrnamespace=6&gsrlimit=28&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1024&format=json&origin=*`;const data=await fetch(url).then(r=>r.json());const pages=Object.values(data.query?.pages||{});return pages.map(p=>{const info=p.imageinfo?.[0];const meta=info?.extmetadata||{};const lic=`${meta.LicenseShortName?.value||''} ${meta.UsageTerms?.value||''}`;return{title:p.title,url:info?.thumburl||info?.url,license:lic}}).filter(x=>x.url&&/Public domain|CC0|PDM|CC-0|Zero/i.test(x.license)).slice(0,10)}
async function fetchAsDataUrl(url){const res=await fetch(url);const blob=await res.blob();return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
async function loadPublicTextures(){const q=$('query').value.trim()||'canvas clay abstract';setStatus('Buscando texturas públicas...');try{const sources=shuffle(await fetchWikimedia(q));const loaded=[];for(const src of sources){try{const dataUrl=await fetchAsDataUrl(src.url);const tx=await textureLoader.loadAsync(dataUrl);loaded.push(prepTexture(tx))}catch(e){}if(loaded.length>=6)break}if(loaded.length){state.textures=loaded;setStatus(`Cargadas ${loaded.length} texturas públicas.`);buildCharacter()}else setStatus('No entraron texturas públicas. Uso internas.')}catch(e){setStatus('La búsqueda falló. Uso texturas internas.')}}
async function randomize(){const names=['MANGO GHOST','TURBO MACHINE','CANVAS DOG','BARRIO LOOP','RED PLASTIC','BLUE MUTANT','SANTS BLOOM','SOFT SIGNAL'];$('charName').value=rand(names);$('abstractness').value=Math.floor(rnd(55,100));$('poseChaos').value=Math.floor(rnd(45,100));$('chunkiness').value=Math.floor(rnd(35,95));$('vibe').value=rand(['og','red','blue','pink','green']);buildCharacter();try{await loadPublicTextures()}catch(e){}}
function explode(){const pieces=[];state.root.traverse(obj=>{if(obj.isMesh){obj.userData.v=new THREE.Vector3(rnd(-.16,.16),rnd(.06,.24),rnd(-.16,.16));obj.userData.r=new THREE.Vector3(rnd(-.12,.12),rnd(-.12,.12),rnd(-.12,.12));pieces.push(obj);if(obj.material){obj.material.transparent=true;obj.material.opacity=1}}});let tick=0;const timer=setInterval(()=>{tick++;for(const obj of pieces){obj.position.add(obj.userData.v);obj.userData.v.y-=.008;obj.rotation.x+=obj.userData.r.x;obj.rotation.y+=obj.userData.r.y;obj.rotation.z+=obj.userData.r.z;if(obj.material)obj.material.opacity=Math.max(0,obj.material.opacity-.015)}if(tick>80){clearInterval(timer);clearRoot();setStatus('El personaje ha explotado.')}},16)}
async function saveBlob(blob,filename){if(window.OgonamAndroid&&window.OgonamAndroid.saveBase64){const reader=new FileReader();reader.onloadend=()=>{const base64=String(reader.result).split(',')[1];window.OgonamAndroid.saveBase64(filename,blob.type||'application/octet-stream',base64)};reader.readAsDataURL(blob)}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}}
async function recordVideo(){if(state.recording)return;state.recording=true;setStatus('Grabando video 360...');const stream=state.renderer.domElement.captureStream(30);const chunks=[];const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start();const start=state.root.rotation.y;for(let i=0;i<=120;i++){state.root.rotation.y=start+Math.PI*2*(i/120);render();await new Promise(r=>setTimeout(r,1000/30))}recorder.stop();await new Promise(r=>recorder.onstop=r);await saveBlob(new Blob(chunks,{type:'video/webm'}),`ogonam-360-${Date.now()}.webm`);state.recording=false;setStatus('Video guardado en Descargas/Ogonam.')}
async function recordGif(){if(state.recording)return;if(typeof GIF==='undefined'){setStatus('La librería GIF no cargó. Prueba video.');return}state.recording=true;setStatus('Grabando GIF 360...');const gif=new GIF({workers:2,quality:12,workerScript:'https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.worker.js',width:state.renderer.domElement.width,height:state.renderer.domElement.height});const start=state.root.rotation.y;for(let i=0;i<48;i++){state.root.rotation.y=start+Math.PI*2*(i/48);render();gif.addFrame(state.renderer.domElement,{copy:true,delay:60});await new Promise(r=>setTimeout(r,20))}gif.on('finished',async blob=>{await saveBlob(blob,`ogonam-360-${Date.now()}.gif`);state.recording=false;setStatus('GIF guardado en Descargas/Ogonam.')});gif.render()}
function render(){if(state.renderer&&state.scene&&state.camera)state.renderer.render(state.scene,state.camera)}function animate(){requestAnimationFrame(animate);if(state.root&&!state.recording){state.root.rotation.y+=.004;state.root.children.forEach(obj=>{obj.rotation.x+=obj.userData.spin||0;obj.rotation.z+=(obj.userData.spin||0)*.6})}if(state.controls)state.controls.update();render()}
function bind(){$('charName').addEventListener('input',updateName);$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadPublicTextures()}});$('randomizeBtn').addEventListener('click',randomize);$('explodeBtn').addEventListener('click',explode);$('recordVideoBtn').addEventListener('click',recordVideo);$('recordGifBtn').addEventListener('click',recordGif);['abstractness','poseChaos','chunkiness','vibe'].forEach(id=>{$(id).addEventListener('input',buildCharacter)})}
function init(){createScene();bind();buildCharacter();animate();setTimeout(loadPublicTextures,900)}init();
</script>
</body>
</html>
